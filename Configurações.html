<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varginha Seguros - Configurações</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f7fe; display: flex; min-height: 100vh; color: #1b2559; }

        /* --- Sidebar --- */
        .sidebar { width: 260px; background-color: #0b1437; color: #fff; display: flex; flex-direction: column; padding: 2rem 1.5rem; flex-shrink: 0; }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 3rem; padding-left: 10px; }
        .brand i { font-size: 1.8rem; }
        .brand h2 { font-size: 1.2rem; line-height: 1; }
        .brand span { font-size: 0.7rem; color: #a3aed0; letter-spacing: 1px; }
        .nav-links { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
        .nav-links li a { color: #a3aed0; text-decoration: none; display: flex; align-items: center; gap: 15px; padding: 12px 15px; border-radius: 8px; font-weight: 500; transition: all 0.3s; }
        .nav-links li a:hover, .nav-links li.active a { background-color: #1b2559; color: #ffffff; }
        .nav-links li.active a { background-color: #4318ff; }
        .logout { margin-top: auto; }

        /* --- Main Content --- */
        .main-content { flex: 1; padding: 2rem 3rem; overflow-y: auto; }
        .content-wrapper { width: 100%; max-width: 1050px; margin: 0 auto; }
        .page-title { font-size: 1.2rem; color: #1b2559; font-weight: 700; text-transform: uppercase; margin-bottom: 1.5rem; }

        /* --- Abas de Navegação (Tabs) --- */
        .tabs-nav {
            display: flex;
            gap: 2rem;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 2rem;
        }

        .tab-item {
            padding-bottom: 0.8rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #a3aed0;
            text-decoration: none;
            position: relative;
            cursor: pointer;
        }

        .tab-item.active {
            color: #0047cc;
        }

        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #0047cc;
            border-radius: 3px 3px 0 0;
        }

        /* --- Card do Formulário --- */
        .settings-card {
            background: #fff;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            width: 100%;
        }

        .section-title {
            font-size: 1.05rem;
            color: #1b2559;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #2b3674;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            color: #2b3674;
            background-color: #fff;
            transition: 0.3s;
            appearance: none;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #a3aed0;
            pointer-events: none;
        }

        .input-group input:focus, .input-group select:focus { border-color: #0047cc; }
        .input-group input::placeholder { color: #a3aed0; }

        /* Tamanhos das colunas */
        .col-4 { grid-column: span 4; }
        .col-6 { grid-column: span 6; }
        .col-8 { grid-column: span 8; }

        /* Botão Salvar */
        .actions-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        .btn-save {
            background-color: #0047cc;
            color: #fff;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-save:hover { background-color: #003399; }

        /* Responsividade */
        @media (max-width: 900px) {
            .col-4, .col-6, .col-8 { grid-column: span 12; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-shield-halved"></i>
            <div>
                <h2>VARGINHA</h2>
                <span>SEGUROS</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="#"><i class="fa-solid fa-house"></i> Dashboard</a></li>
            <li><a href="#"><i class="fa-solid fa-plus"></i> Nova Cotação</a></li>
            <li><a href="#"><i class="fa-solid fa-file-invoice-dollar"></i> Cotações</a></li>
            <li><a href="#"><i class="fa-solid fa-users"></i> Clientes</a></li>
            <li><a href="#"><i class="fa-solid fa-building-shield"></i> Seguradoras</a></li>
            <li><a href="#"><i class="fa-solid fa-chart-pie"></i> Relatórios</a></li>
            <li><a href="#"><i class="fa-solid fa-user-tie"></i> Usuários</a></li>
            <li class="active"><a href="#"><i class="fa-solid fa-gear"></i> Configurações</a></li>
            <li class="logout"><a href="#"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="content-wrapper">
            
            <h1 class="page-title">18. Configurações</h1>

            <!-- Abas de Navegação -->
            <div class="tabs-nav">
                <div class="tab-item active">Geral</div>
                <div class="tab-item">Notificações</div>
                <div class="tab-item">E-mails</div>
                <div class="tab-item">Integrações</div>
                <div class="tab-item">Segurança</div>
            </div>

            <div class="settings-card">
                <h2 class="section-title">Dados da Corretora</h2>
                
                <form action="#">
                    <div class="form-grid">
                        <!-- Linha 1 -->
                        <div class="input-group col-4">
                            <label>Nome Fantasia</label>
                            <input type="text" value="Varginha Seguros">
                        </div>
                        <div class="input-group col-4">
                            <label>Razão Social</label>
                            <input type="text" value="Varginha Corretora de Seguros LTDA">
                        </div>
                        <div class="input-group col-4">
                            <label>CNPJ</label>
                            <input type="text" value="13.345.678/0001-90" data-mask="cpfCnpj" maxlength="18">
                        </div>

                        <!-- Linha 2 -->
                        <div class="input-group col-6">
                            <label>Telefone</label>
                            <input type="text" value="(35) 99999-9999" data-mask="telefone" maxlength="15">
                        </div>
                        <div class="input-group col-6">
                            <label>E-mail</label>
                            <div class="select-wrapper">
                                <select>
                                    <option value="contato@varginhaseguros.com.br" selected>contato@varginhaseguros.com.br</option>
                                    <option value="suporte@varginhaseguros.com.br">suporte@varginhaseguros.com.br</option>
                                </select>
                            </div>
                        </div>

                        <!-- Linha 3 -->
                        <div class="input-group col-4">
                            <label>CEP</label>
                            <input type="text" value="37000-000" data-mask="cep" maxlength="9">
                        </div>
                        <div class="input-group col-8">
                            <label>Endereço</label>
                            <input type="text" value="Rua das Flores, 123 - Centro">
                        </div>

                        <!-- Linha 4 -->
                        <div class="input-group col-6">
                            <label>Cidade</label>
                            <input type="text" value="Varginha">
                        </div>
                        <div class="input-group col-6">
                            <label>Estado</label>
                            <div class="select-wrapper">
                                <select>
                                    <option value="MG" selected>MG</option>
                                    <option value="SP">SP</option>
                                    <option value="RJ">RJ</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Botão Salvar -->
                    <div class="actions-footer">
                        <button type="button" class="btn-save">Salvar Configurações</button>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <!-- SCRIPT DE MÁSCARAS UNIVERSAIS -->
    <script>
        const masks = {
            cep: (value) => {
                return value
                    .replace(/\D/g, '')
                    .replace(/^(\d{5})(\d)/, '$1-$2')
                    .substring(0, 9);
            },
            cpfCnpj: (value) => {
                value = value.replace(/\D/g, '');
                if (value.length <= 11) {
                    return value
                        .replace(/(\d{3})(\d)/, '$1.$2')
                        .replace(/(\d{3})(\d)/, '$1.$2')
                        .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                } else {
                    return value
                        .replace(/^(\d{2})(\d)/, '$1.$2')
                        .replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
                        .replace(/\.(\d{3})(\d)/, '.$1/$2')
                        .replace(/(\d{4})(\d)/, '$1-$2')
                        .substring(0, 18);
                }
            },
            telefone: (value) => {
                value = value.replace(/\D/g, '');
                return value
                    .replace(/^(\d{2})(\d)/g, '($1) $2')
                    .replace(/(\d)(\d{4})$/, '$1-$2')
                    .substring(0, 15);
            }
        };

        document.querySelectorAll('input[data-mask]').forEach(input => {
            input.addEventListener('input', (e) => {
                const maskType = e.target.getAttribute('data-mask');
                if (masks[maskType]) {
                    e.target.value = masks[maskType](e.target.value);
                }
            });
        });
    </script>
</body>
</html>
