<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varginha Seguros - Sistema de Multicotação</title>
    <!-- Font Awesome para os ícones do logo e da senha -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reset Básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container Principal (Layout Split-Screen) */
        .container {
            display: flex;
            width: 100%;
            max-width: 1100px;
            min-height: 85vh;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            margin: 20px;
        }

        /* --- Painel Esquerdo --- */
        .left-panel {
            flex: 1;
            background-color: #fcfcfc;
            padding: 4rem 4rem 2rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            border-right: 1px solid #f0f0f0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 4rem;
        }

        .logo-icon {
            font-size: 2.8rem;
            color: #0033a0;
        }

        .brand-text h1 {
            font-size: 1.6rem;
            color: #002060;
            line-height: 1;
            letter-spacing: 0.5px;
        }

        .brand-text span {
            font-size: 0.85rem;
            color: #555;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .intro h2 {
            font-size: 1.6rem;
            color: #1a1a1a;
            margin-bottom: 1rem;
        }

        .intro p {
            color: #666;
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 2rem;
            max-width: 90%;
        }

        .illustration {
            text-align: center;
            margin-top: auto;
        }

        .img-fluid {
            max-width: 100%;
            height: auto;
        }

        /* --- Painel Direito --- */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem;
            background-color: #ffffff;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #222;
            margin-bottom: 0.5rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-color: #0044cc;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            cursor: pointer;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 2rem;
        }

        .forgot-password a, .register-link a {
            color: #0056b3;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .forgot-password a:hover, .register-link a:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            background-color: #0047cc;
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-login:hover {
            background-color: #003399;
        }

        .register-link {
            font-size: 0.85rem;
            color: #666;
        }

        /* --- Responsividade --- */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                height: auto;
                border-radius: 0;
                margin: 0;
                box-shadow: none;
            }
            
            .left-panel, .right-panel {
                padding: 2rem;
                border-right: none;
            }

            .left-panel {
                border-bottom: 1px solid #eee;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Painel Esquerdo: Branding e Ilustração -->
        <section class="left-panel">
            <div class="brand">
                <i class="fa-solid fa-shield-halved logo-icon"></i>
                <div class="brand-text">
                    <h1>VARGINHA</h1>
                    <span>SEGUROS</span>
                </div>
            </div>

            <div class="intro">
                <h2>Sistema de Multicotação</h2>
                <p>Compare preços das principais seguradoras em um só lugar.</p>
            </div>

            <div class="illustration">
                <!-- Substitua o src abaixo pelo caminho da sua imagem -->
                <img src="assets/img/ilustracao-veiculo-escudo.png" alt="Ilustração de um veículo protegido por um escudo na cidade" class="img-fluid">
            </div>
        </section>

        <!-- Painel Direito: Formulário de Login -->
        <section class="right-panel">
            <div class="login-card">
                <form action="#" method="POST">
                    
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>

                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <div class="password-wrapper">
                            <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                            <i class="fa-regular fa-eye-slash toggle-password"></i>
                        </div>
                    </div>

                    <div class="forgot-password">
                        <a href="#">Esqueceu sua senha?</a>
                    </div>

                    <button type="submit" class="btn-login">Entrar</button>
                    
                </form>
            </div>

            <div class="register-link">
                <p>Não tem uma conta? <a href="#">Fale com o administrador</a></p>
            </div>
        </section>

    </div>
</body>
</html>
